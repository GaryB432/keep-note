name: Node.js CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      # Install after cache is restored and Node 24 is loaded
      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint
      - run: pnpm run test
